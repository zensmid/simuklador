name: study
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 0"      # domingos: re-estudia qué factores funcionan
permissions:
  contents: write
concurrency: study
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: analyst study --universe universo.txt
      - name: Publicar estudio
        run: |
          git config user.name "scan-bot" && git config user.email "bot@users.noreply.github.com"
          git add reports/study.md docs/data/study.json && (git diff --cached --quiet || git commit -m "study $(date -u +%FT%H:%MZ)")
          git pull --rebase -q && git push
