<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Analyst</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1d24;--mu:#6b7280;--ln:#e5e7eb;--g:#15803d;--r:#b91c1c;--y:#a16207;--ac:#2563eb;--gb:#dcfce7;--rb:#fee2e2;--yb:#fef9c3}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--tx:#e6e8ee;--mu:#8b93a7;--ln:#2a303b;--g:#4ade80;--r:#f87171;--y:#facc15;--ac:#60a5fa;--gb:#14532d66;--rb:#7f1d1d66;--yb:#71370066}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:1180px;margin:auto;padding:16px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.mu{color:var(--mu)}.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:12px}
.chip b{display:block;font-size:13px}.up{color:var(--g)}.dn{color:var(--r)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mu);font-weight:600;cursor:pointer;user-select:none}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}.wrap{overflow-x:auto}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}.b-g{background:var(--gb);color:var(--g)}.b-r{background:var(--rb);color:var(--r)}.b-y{background:var(--yb);color:var(--y)}
.bar{position:relative;height:10px;background:var(--ln);border-radius:5px;min-width:120px}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ac)}.bar i.over{background:var(--r)}.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--tx);opacity:.6}
.ok{color:var(--g)}.bad{color:var(--r)}ul{margin:6px 0;padding-left:18px}li{margin:2px 0}
.kpi{display:flex;flex-wrap:wrap;gap:18px}.kpi div b{display:block;font-size:20px}
#detail{display:none}#detail.on{display:block}canvas{width:100%;height:200px;display:block}
.md h1,.md h2,.md h3{font-size:14px;margin:12px 0 4px}.md p{margin:4px 0}.empty{text-align:center;padding:60px 10px;color:var(--mu)}
.warn{background:var(--yb);color:var(--y);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:13px}
.x{float:right;cursor:pointer;color:var(--mu)}
</style></head><body><main>
<div id="app"><div class="empty">Cargando…</div></div>
</main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(v,d=1)=>v==null?'n/d':(v*100).toFixed(d)+'%';
const spct=(v,d=1)=>v==null?'n/d':(v>=0?'+':'')+(v*100).toFixed(d)+'%';
const usd=v=>v==null?'n/d':'$'+Math.round(v).toLocaleString('en-US');
const cls=v=>v>0?'up':v<0?'dn':'';
const rb=r=>({'COMPRA FUERTE':'b-g','COMPRA':'b-g','MANTENER':'b-y','VENTA':'b-r','VENTA FUERTE':'b-r'}[r]||'b-y');
const badge=r=>r?`<span class="badge ${rb(r)}">${esc(r)}</span>`:'';
let D=null,sortKey='score',sortDir=-1;

function md(t){ // markdown mínimo y seguro
  return esc(t).split(/\n{2,}/).map(b=>{
    if(/^#{1,3} /.test(b))return`<h3>${b.replace(/^#+ /,'')}</h3>`;
    if(/^[-*] /m.test(b))return'<ul>'+b.split('\n').map(l=>`<li>${l.replace(/^[-*] /,'')}</li>`).join('')+'</ul>';
    return`<p>${b.replace(/\n/g,'<br>')}</p>`}).join('').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}
function ago(iso){const m=(Date.now()-new Date(iso))/6e4;return m<60?`hace ${Math.round(m)} min`:m<1440?`hace ${(m/60).toFixed(1)} h`:`hace ${(m/1440).toFixed(1)} d`}
function countdown(){const ms=new Date('2026-10-17T03:59:00Z')-Date.now();if(ms<=0)return'plazo vencido';const h=Math.floor(ms/36e5);return`${Math.floor(h/24)}d ${h%24}h`}

function render(){
  const d=D;
  if(!d||d.empty){$('#app').innerHTML='<div class="empty"><h2>Esperando el primer escaneo</h2>Ejecuta el workflow <b>scan</b> en la pestaña Actions de GitHub.</div>';return}
  const pos=d.positions||[],known=pos.filter(p=>!p.unknown);
  const invested=pos.reduce((a,p)=>a+p.value,0),cash=d.cash!=null?d.cash:d.capital-invested,cashAfter=d.cash_after!=null?d.cash_after:cash,maxW=Math.max(0,...pos.map(p=>p.weight));
  const nonOther=pos.filter(p=>p.ticker!=='OTHER').length;
  const checks=[[maxW<=d.max_weight+1e-9,`Máx. por posición ${pct(maxW)} (límite 20%)`],[pos.length>=5,`${pos.length} posiciones (mínimo 5)`],
    [Math.abs(cashAfter)<d.capital*0.005,`Efectivo hoy ${usd(cash)}; tras las órdenes ${usd(cashAfter)}`],[true,'Solo largos, sin apalancamiento, sin ETFs']];
  const unk=pos.some(p=>p.unknown);
  const strip=(d.market||[]).map(m=>`<div class="chip">${esc(m.name)}<b>${m.last.toLocaleString('en-US',{maximumFractionDigits:2})}</b><span class="${cls(m.d1)}">${spct(m.d1,2)}</span> <span class="mu">1M ${spct(m.m1)}</span></div>`).join('');
  $('#app').innerHTML=`
  <div class="top"><div><h1>Trading Analyst · Bloomberg Challenge</h1><div class="mu">Actualizado ${ago(d.updated)} · universo ${d.universe} · con datos ${d.screened}</div></div>
    <div class="kpi"><div><span class="mu">Plazo inversión 100%</span><b>${countdown()}</b></div><div><span class="mu">Posiciones</span><b>${pos.length}</b></div><div><span class="mu">Efectivo disponible</span><b>${usd(cash)}</b></div></div></div>
  ${strip?`<div class="strip">${strip}</div>`:''}
  ${unk?'<div class="warn">Hay posición(es) “OTHER” sin identificar en holdings.csv: reemplázala por el ticker real.</div>':''}
  <div class="grid"><div class="card"><h2>Reglas del concurso</h2><ul>${checks.map(c=>`<li class="${c[0]?'ok':'bad'}">${c[0]?'✔':'✖'} ${esc(c[1])}</li>`).join('')}</ul>
    <div class="mu">Gana el mayor Relative P&amp;L (ver TMSG&lt;GO&gt;).</div></div>
    <div class="card"><h2>Órdenes sugeridas (USD)</h2>${(d.orders||[]).length?'<table>'+d.orders.map(o=>`<tr><td><span class="badge ${o.action==='COMPRAR'?'b-g':'b-r'}">${esc(o.action)}</span> ${esc(o.ticker)}</td><td>${usd(o.usd)}</td><td class="mu" style="text-align:left;white-space:normal">${esc(o.note)}</td></tr>`).join('')+'</table>':'<span class="mu">Sin ajustes necesarios.</span>'}
    <div class="mu" style="margin-top:6px">Las envía el Capitán en la Terminal.</div></div></div>
  <div class="card"><h2>Cartera actual</h2><div class="wrap"><table><tr><th>Ticker</th><th>Valor</th><th>Peso (línea = 20%)</th><th>Rec</th><th>Score</th><th>1M</th><th>3M</th><th>RSI</th><th>Resultados</th></tr>
  ${pos.map(p=>{const ev=(d.events||[]).find(e=>e.ticker===p.ticker);
   return`<tr class="row" data-t="${esc(p.ticker)}"><td><b>${esc(p.ticker)}</b>${p.name?` <span class="mu">${esc(p.name)}</span>`:''}</td><td>${usd(p.value)}</td>
   <td><div class="bar"><i class="${p.weight>d.max_weight?'over':''}" style="width:${Math.min(100,p.weight/0.25*100)}%"></i><u style="left:${d.max_weight/0.25*100}%"></u></div> <span class="${p.weight>d.max_weight?'dn':''}">${pct(p.weight)}</span></td>
   <td>${p.unknown?'<span class="mu">?</span>':badge(p.rec)}</td><td>${p.score!=null?p.score.toFixed(2):''}</td><td class="${cls(p.ret_1m)}">${p.unknown?'':spct(p.ret_1m)}</td><td class="${cls(p.ret_3m)}">${p.unknown?'':spct(p.ret_3m)}</td>
   <td>${p.rsi!=null?p.rsi.toFixed(0):''}</td><td>${ev&&ev.next_date?esc(ev.next_date)+' ('+ev.days_to+'d)':'<span class="mu">n/d</span>'}</td></tr>`}).join('')}</table></div></div>
  <div id="detail" class="card"></div>
  <div class="card"><h2>Ranking del universo (top ${d.ranking.length})</h2><div class="wrap"><table id="rk"><thead><tr>
   <th data-k="ticker">Ticker</th><th data-k="rec">Rec</th><th data-k="score">Score</th><th data-k="tech">Téc</th><th data-k="fund">Fund</th><th data-k="sent">Noticias</th><th data-k="ret_3m">3M</th><th data-k="ret_1y">1A</th><th data-k="vol">Vol</th></tr></thead><tbody></tbody></table></div></div>
  <div class="grid"><div class="card"><h2>Calendario de resultados</h2><div class="wrap"><table><tr><th>Ticker</th><th>Fecha</th><th>Días</th><th>EPS est.</th><th>Reacción pasada</th><th>Objetivo analistas</th></tr>
   ${(d.events||[]).slice().sort((a,b)=>(a.days_to??1e9)-(b.days_to??1e9)).map(e=>{const tg=e.targets||{},up=tg.targetMeanPrice&&tg.currentPrice?spct(tg.targetMeanPrice/tg.currentPrice-1,0):'n/d';
    return`<tr><td>${esc(e.ticker)}</td><td>${esc(e.next_date||'n/d')}</td><td>${e.days_to??'-'}</td><td>${e.eps_est??'n/d'}</td><td>${(e.history||[]).map(h=>spct(h.move_1d)).join(', ')||'n/d'}</td><td>${up}</td></tr>`}).join('')}</table></div></div>
  <div class="card"><h2>Briefing (Claude)</h2><div class="md">${md(d.brief||'')}</div></div></div>
  <div class="mu" style="padding:6px 2px 24px">Herramienta educativa; no es asesoría financiera. Puntajes y escenarios son estimaciones.</div>`;
  fillRank();
  document.querySelectorAll('tr.row').forEach(r=>r.onclick=()=>showDetail(r.dataset.t));
  document.querySelectorAll('#rk th').forEach(h=>h.onclick=()=>{const k=h.dataset.k;sortDir=sortKey===k?-sortDir:-1;sortKey=k;fillRank()});
}
function fillRank(){
  const rows=D.ranking.slice().sort((a,b)=>{const x=a[sortKey],y=b[sortKey];return(typeof x==='string'?x.localeCompare(y):(x??-9)-(y??-9))*sortDir});
  $('#rk tbody').innerHTML=rows.map(r=>`<tr class="row" data-t="${esc(r.ticker)}"><td><b>${esc(r.ticker)}</b></td><td>${badge(r.rec)}</td><td>${r.score.toFixed(2)}</td><td>${r.tech.toFixed(2)}</td><td>${r.fund.toFixed(2)}</td><td>${r.sent.toFixed(2)}</td><td class="${cls(r.ret_3m)}">${spct(r.ret_3m)}</td><td class="${cls(r.ret_1y)}">${spct(r.ret_1y)}</td><td>${pct(r.vol,0)}</td></tr>`).join('');
  document.querySelectorAll('#rk tr.row').forEach(r=>r.onclick=()=>showDetail(r.dataset.t));
}
function showDetail(t){
  const p=(D.positions||[]).find(x=>x.ticker===t)||D.ranking.find(x=>x.ticker===t);if(!p||p.unknown)return;
  const el=$('#detail');el.className='card on';
  el.innerHTML=`<span class="x" onclick="this.parentNode.className='card'">✕</span><h2>${esc(t)} ${p.name?'· '+esc(p.name):''} ${badge(p.rec)} <span class="mu">score ${p.score?.toFixed(2)}</span></h2>
  <div class="kpi" style="margin-bottom:8px"><div><span class="mu">Precio</span><b>${p.price?.toFixed(2)}</b></div><div><span class="mu">Stop 2×ATR</span><b>${p.stop?.toFixed(2)}</b></div><div><span class="mu">Volatilidad</span><b>${pct(p.vol,0)}</b></div><div><span class="mu">P/E</span><b>${p.pe?.toFixed?.(1)??'n/d'}</b></div></div>
  ${p.chart?'<canvas id="ch"></canvas>':''}<div class="grid"><div><b>Técnico</b><ul>${(p.tech_notes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div><b>Fundamental</b><ul>${(p.fund_notes||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
  <div><b>Noticias</b><ul>${(p.news||[]).map(n=>`<li>[${n.s>0?'+':''}${n.s}] ${n.link?`<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)}</li>`).join('')||'<li class="mu">n/d</li>'}</ul></div></div>`;
  if(p.chart)draw($('#ch'),p.chart.close);el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function draw(c,d){const dpr=devicePixelRatio||1,W=c.width=c.clientWidth*dpr,H=c.height=200*dpr,x=c.getContext('2d'),mn=Math.min(...d),mx=Math.max(...d);
 const st=getComputedStyle(document.documentElement);x.strokeStyle=st.getPropertyValue('--ac');x.lineWidth=2*dpr;x.beginPath();
 d.forEach((v,i)=>{const px=i/(d.length-1)*W,py=H-(v-mn)/(mx-mn||1)*(H-16*dpr)-8*dpr;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
fetch('data/latest.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j;render()}).catch(e=>{$('#app').innerHTML='<div class="empty">No se pudo cargar data/latest.json</div>'});
setInterval(()=>{if(D&&!D.empty)render()},6e4);
</script></body></html>
