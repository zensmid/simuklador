name: scan
on:
  schedule:
    - cron: "15 12 * * 1-5"    # 08:15 ET: antes de la apertura de EE. UU. (Asia ya cerró)
    - cron: "15 21 * * 1-5"    # 17:15 ET: tras el cierre de EE. UU.
    - cron: "45 23 * * 0-4"    # antes de la apertura de Asia
  workflow_dispatch:
permissions:
  contents: write
concurrency: scan
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: analyst scan --universe universo.txt --holdings holdings.csv --top 40
        env:
          DATA_PROVIDER: yfinance
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publicar reporte
        run: |
          git config user.name "scan-bot" && git config user.email "bot@users.noreply.github.com"
          git add reports docs/data && (git diff --cached --quiet || git commit -m "scan $(date -u +%FT%H:%MZ)")
          git pull --rebase -q && git push
